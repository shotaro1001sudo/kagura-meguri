name: build-and-deploy
on:
  push: { branches: [main] }
  schedule: [{ cron: "0 18 * * *" }] # 毎日3:00 JST: 終了イベントの整理・再生成
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 止まったときに長時間動き続けて、実行時間を使い切らないための上限
    outputs:
      indexnow_body: ${{ steps.indexnow.outputs.indexnow_body }}
    steps:
      # 外部のアクションは、版の名前(タグ)ではなく、中身を指す番号(コミットSHA)で固定する(タグの付け替えによる、すり替えを防ぐ)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # テストに失敗したら公開しない(不正なデータや表示崩れを、サイトに出さないため)
      - run: npm test
      # 夜神楽などの開催ページに出す、会場近くの宿(楽天トラベルの施設検索 API)。鍵が無い・失敗したときは出さないだけで、公開は続ける
      - run: node scripts/fetch-hotels.mjs
        continue-on-error: true
        timeout-minutes: 3
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      # データに誤りがあれば、ここでビルドが止まる
      - run: node scripts/build.mjs
      # IndexNow: いま公開中のサイトマップと比べ、新しいページ・変わったページを決める(送るのは公開のあと)。失敗しても公開は続ける
      - id: indexnow
        run: node scripts/indexnow-plan.mjs
        continue-on-error: true
        timeout-minutes: 2
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # v4 以降は、名前が「.」で始まるファイルを、既定で除外する。/.well-known/security.txt を公開するため、含める
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: dist, include-hidden-files: true }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 公開1回の待ちは最長10分(deploy-pages の上限で、延ばせない)。時間切れなら1回だけやり直すので、2回分+余裕
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      # GitHub Pages が混んでいると「ファイル同期中」のまま10分を超え、取り消されることがある(2026-11-10)
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - id: deployment-retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  # 公開が済んでから、Bing などに新しいページ・変わったページを知らせる(IndexNow)。
  # 知らせられなくても、公開の結果(このワークフローの成否)は変えない
  indexnow:
    needs: [build, deploy]
    if: ${{ needs.build.outputs.indexnow_body != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    permissions: {}
    steps:
      - name: notify IndexNow
        env:
          BODY: ${{ needs.build.outputs.indexnow_body }}
        run: |
          code=$(printf '%s' "$BODY" | curl -sS -m 30 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' --data-binary @- https://api.indexnow.org/indexnow)
          echo "IndexNow: HTTP $code"
          case "$code" in 200|202) ;; *) exit 1 ;; esac
