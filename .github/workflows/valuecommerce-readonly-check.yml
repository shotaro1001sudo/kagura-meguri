name: valuecommerce-readonly-check
# Manual-only until credentials and secure private storage are verified.
on:
  workflow_dispatch:

permissions: { contents: read }
concurrency: { group: valuecommerce-readonly-check, cancel-in-progress: false }

jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Verify token and report endpoint without reporting order data
        env:
          VALUECOMMERCE_CLIENT_KEY: ${{ secrets.VALUECOMMERCE_CLIENT_KEY }}
          VALUECOMMERCE_CLIENT_SECRET: ${{ secrets.VALUECOMMERCE_CLIENT_SECRET }}
        run: node scripts/valuecommerce-report-check.mjs
