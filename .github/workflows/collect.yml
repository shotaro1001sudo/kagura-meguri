name: collect
on:
  schedule: [{ cron: "0 20 * * 0" }] # 毎週月曜 5:00 JST
  workflow_dispatch:
permissions: { contents: write, pull-requests: write }
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/collect.mjs
      - run: node scripts/geocode.mjs
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: collect/auto
          title: "開催情報の自動収集(確認待ち)"
          body-path: data/collect-report.md
          commit-message: "chore: collect pending events"