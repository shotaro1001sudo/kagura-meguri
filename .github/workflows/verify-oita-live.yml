name: verify-oita-live-readonly
on:
  pull_request:
    paths:
      - 'scripts/verify-oita-live.mjs'
      - '.github/workflows/verify-oita-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Validate live HTML only (do not collect/publish)
        run: node scripts/verify-oita-live.mjs
