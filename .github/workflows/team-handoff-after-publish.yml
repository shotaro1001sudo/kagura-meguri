name: team-handoff-after-publish
# サイトの公開(build-and-deploy)が失敗したときだけ、調査用の Issue を立てる。
# 公開成功の引継ぎIssue(【集客引継ぎ・公開処理成功】)は 2026-11-07 に廃止し、開いているものは自動で閉じる。
on:
  workflow_run:
    workflows: [build-and-deploy]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: team-handoff-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  route:
    # Handle only our default-branch deploys, not any fork or PR-generated payload.
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Identify user-facing file changes, without executing changed application code
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git diff-tree --no-commit-id --name-only -r "$RUN_SHA" > "$RUNNER_TEMP/kagura-files.txt"
      - name: Route only verified publish completion or failure
        id: route
        env:
          HANDOFF_CHANGED_FILES_FILE: ${{ runner.temp }}/kagura-files.txt
        run: node scripts/handoff/event-router.mjs
      - name: Create an idempotent issue only when publishing failed
        if: ${{ steps.route.outputs.handoff == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_TITLE: ${{ steps.route.outputs.title }}
          HANDOFF_BODY: ${{ steps.route.outputs.body }}
        run: |
          # Same run -> same title. Do not open duplicates on reruns.
          if gh issue list --state all --limit 100 --json title --jq '.[].title' | grep -Fqx -- "$HANDOFF_TITLE"; then
            echo "既存のIssueを確認。重複作成しません。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s\n' "$HANDOFF_BODY" > "$RUNNER_TEMP/kagura-handoff.txt"
          gh issue create --title "$HANDOFF_TITLE" --body-file "$RUNNER_TEMP/kagura-handoff.txt" >/dev/null
      # 廃止した「公開成功の引継ぎIssue」が開いていれば閉じる(なければ何もしない)
      - name: Close retired publication-evidence issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --limit 200 --search "集客引継ぎ 公開処理成功 in:title" --json number,title --jq '.[] | select(.title | startswith("【集客引継ぎ・公開処理成功】")) | .number' |
          while read -r n; do
            gh issue close "$n" --reason "not planned" --comment "公開成功の引継ぎIssueは廃止しました(AUTOMATION.md)。公開の失敗時だけ Issue を立てます。" >/dev/null
          done
