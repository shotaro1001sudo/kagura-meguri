<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 100" width="40" height="100">
<!-- トップの札の間に下げる紙垂(しで)。運営者が送った写真(社の前の縄に下げた紙垂)に寄せた形。
     白い紙を互い違いに切って、斜めに折り下げた4段。表の面は白く、折り返して見える裏の面は灰色がかった白。
     上の端は縄に掛けて後ろへ回す: 上の小さな耳(0〜6)と、本体(16〜)の間を空け、そこに縄が見える(縄の太さは、絵の高さの約1割) -->
<defs>
<linearGradient id="f" x1="0" y1="0" x2="1" y2=".3"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f6f4ef"/><stop offset="1" stop-color="#e4e0d6"/></linearGradient>
<linearGradient id="r" x1="0" y1="0" x2="1" y2=".3"><stop offset="0" stop-color="#e3dfd5"/><stop offset="1" stop-color="#c9c3b6"/></linearGradient>
<linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2418" stop-opacity=".22"/><stop offset="1" stop-color="#2a2418" stop-opacity="0"/></linearGradient>
</defs>
<g stroke="#b5ad9c" stroke-width=".5" stroke-linejoin="round">
<path d="M17 0H24V6.5H17Z" fill="url(#f)"/>
<path d="M12 15.5H28L25 38L8 35Z" fill="url(#f)"/>
<path d="M8 35L25 38L33 58L16 55Z" fill="url(#r)"/>
<path d="M16 55L33 58L24 79L7 76Z" fill="url(#f)"/>
<path d="M7 76L24 79L31 99L14 96Z" fill="url(#r)"/>
</g>
<path d="M8 35L25 38L26.4 41.5L9.4 38.5Z" fill="url(#c)"/>
<path d="M16 55L33 58L31.5 61.4L14.5 58.4Z" fill="url(#c)"/>
<path d="M7 76L24 79L25.2 82.5L8.2 79.5Z" fill="url(#c)"/>
</svg>
